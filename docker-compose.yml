services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: peblo_tv
      POSTGRES_USER: peblo_user
      POSTGRES_PASSWORD: peblo_password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo_user -d peblo_tv"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://peblo_user:peblo_password@postgres:5432/peblo_tv
      JWT_SECRET: change-me-in-production
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data
      CATALOGUE_STORAGE_PATH: /data/catalog
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/storage:/data
    depends_on:
      postgres:
        condition: service_healthy

  cms:
    build:
      context: ./apps/CMS
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${CMS_PORT:-5173}:5173"
    volumes:
      - ./apps/CMS:/app
      - cms_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

  viewer:
    build:
      context: ./apps/Viewer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${VIEWER_PORT:-5174}:5174"
    volumes:
      - ./apps/Viewer:/app
      - viewer_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
    external: true
    name: api_postgres_data
  cms_node_modules:
  viewer_node_modules: