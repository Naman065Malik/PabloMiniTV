services:
  postgres:
    image: postgres:16-alpine
    container_name: peblo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: peblo_tv
      POSTGRES_USER: peblo_user
      POSTGRES_PASSWORD: peblo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo_user -d peblo_tv"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: